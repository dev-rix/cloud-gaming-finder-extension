name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check manifest and scripts
        run: |
          node -e 'const m = JSON.parse(require("fs").readFileSync("manifest.json", "utf8")); if (m.manifest_version !== 3) throw new Error("Expected MV3")'
          for file in src/*.js; do node --check "$file"; done
